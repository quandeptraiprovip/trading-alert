<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --canvas: #080b0e;
      --border: #242b31;
      --text: #eef2f1;
      --text-soft: #adb8b5;
      --muted: #6f7b79;
      --green: #4ee2a1;
      --blue: #65a9ff;
      --mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      width: 155px;
      height: 155px;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    a { color: var(--blue); }
    a:hover { color: #8bc0ff; }
  </style>
</helmet>

<div style="display: flex; width: 155px; height: 155px; flex-direction: column; padding: 14px; border-radius: 20px; background: linear-gradient(180deg, #101519 0%, #0a0e12 55%, #080b0e 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.055), inset 0 0 0 1px rgba(255, 255, 255, 0.028);">

  <div style="display: flex; align-items: center; gap: 6px;">
    <span style="width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: #4ee2a1; box-shadow: 0 0 0 3px rgba(78, 226, 161, 0.14);"></span>
    <span style="color: #4ee2a1; font: 620 10px/1 var(--sans); letter-spacing: 0.02em;">Đang chạy</span>
  </div>

  <div style="margin-top: 14px;">
    <div style="color: var(--text); font: 300 25px/1 var(--mono); letter-spacing: -0.026em;">$513,11</div>
    <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 8px;">
      <span style="color: var(--green); font: 600 12px/1 var(--mono);">+1,23%</span>
      <span style="color: var(--muted); font: 550 10px/1 var(--mono);">+$6,24</span>
    </div>
  </div>

  <span style="flex: 1;"></span>

  <div style="height: 1px; margin-bottom: 11px; background: var(--border);"></div>

  <div style="display: flex; align-items: baseline; gap: 6px;">
    <span style="color: var(--muted); font: 500 9px/1 var(--sans);">2 vị thế mở</span>
    <span style="flex: 1;"></span>
    <span style="color: var(--green); font: 620 11px/1 var(--mono);">+1,57 R</span>
  </div>

</div>
</x-dc>
</body>
</html>
