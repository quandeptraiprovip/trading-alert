<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --canvas: #080b0e;
      --border: #242b31;
      --text: #eef2f1;
      --text-soft: #adb8b5;
      --muted: #6f7b79;
      --green: #4ee2a1;
      --red: #ff6b70;
      --blue: #65a9ff;
      --amber: #f3ba63;
      --mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      width: 329px;
      height: 155px;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    a { color: var(--blue); }
    a:hover { color: #8bc0ff; }
  </style>
</helmet>

<div style="display: flex; width: 329px; height: 155px; flex-direction: column; padding: 13px 14px; border-radius: 20px; background: linear-gradient(180deg, #101519 0%, #0a0e12 55%, #080b0e 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.055), inset 0 0 0 1px rgba(255, 255, 255, 0.028);">

  <div style="display: flex; align-items: center; gap: 7px;">
    <span style="width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: #4ee2a1; box-shadow: 0 0 0 3px rgba(78, 226, 161, 0.14);"></span>
    <span style="color: #4ee2a1; font: 620 10px/1 var(--sans); letter-spacing: 0.02em;">Đang chạy</span>
    <span style="color: #4c5654; font: 500 10px/1 var(--sans);">·</span>
    <span style="color: var(--muted); font: 500 10px/1 var(--sans);">2 phút trước</span>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 12px; margin-top: 12px;">
    <div style="min-width: 0;">
      <div style="color: var(--text); font: 300 28px/1 var(--mono); letter-spacing: -0.024em;">$513,11</div>
      <div style="display: flex; align-items: baseline; gap: 7px; margin-top: 7px;">
        <span style="color: var(--green); font: 600 12px/1 var(--mono);">+$6,24</span>
        <span style="color: var(--green); font: 600 12px/1 var(--mono);">+1,23%</span>
        <span style="color: var(--muted); font: 500 9px/1 var(--sans);">hôm nay</span>
      </div>
    </div>
    <span style="flex: 1;"></span>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px; padding-bottom: 2px;">
      <span style="color: var(--muted); font: 500 9px/1 var(--sans);">risk mở <span style="color: var(--text-soft); font: 620 10px var(--mono);">2,0%</span></span>
      <span style="color: var(--muted); font: 500 9px/1 var(--sans);">gần stop nhất <span style="color: var(--text-soft); font: 620 10px var(--mono);">4,2%</span></span>
    </div>
  </div>

  <div style="height: 1px; margin: 12px 0 11px; background: var(--border);"></div>

  <div style="display: flex; flex-direction: column; gap: 9px;">

    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="padding: 3px 6px; border-radius: 3px; background: rgba(243, 186, 99, 0.11); color: var(--amber); font: 700 9px/1 var(--sans); letter-spacing: 0.09em;">BINANCE</span>
      <span style="color: var(--text-soft); font: 550 11px/1 var(--mono);">$192,68</span>
      <span style="width: 1px; height: 11px; background: var(--border);"></span>
      <span style="color: var(--text); font: 650 12px/1 var(--mono); letter-spacing: 0.01em;">SOL</span>
      <span style="padding: 2px 5px; border-radius: 3px; background: rgba(78, 226, 161, 0.12); color: var(--green); font: 700 8px/1.2 var(--sans); letter-spacing: 0.08em;">LONG</span>
      <span style="flex: 1;"></span>
      <span style="color: var(--green); font: 620 12px/1 var(--mono);">+1,00 R</span>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="padding: 3px 6px; border-radius: 3px; background: rgba(101, 169, 255, 0.12); color: var(--blue); font: 700 9px/1 var(--sans); letter-spacing: 0.09em;">MEXC</span>
      <span style="color: var(--text-soft); font: 550 11px/1 var(--mono);">$320,43</span>
      <span style="width: 1px; height: 11px; background: var(--border);"></span>
      <span style="color: var(--text); font: 650 12px/1 var(--mono); letter-spacing: 0.01em;">DOT</span>
      <span style="padding: 2px 5px; border-radius: 3px; background: rgba(255, 107, 112, 0.12); color: var(--red); font: 700 8px/1.2 var(--sans); letter-spacing: 0.08em;">SHORT</span>
      <span style="flex: 1;"></span>
      <span style="color: var(--green); font: 620 12px/1 var(--mono);">+0,57 R</span>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
