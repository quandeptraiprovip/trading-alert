# Chạy cả BOT alert đa-symbol + CHART perpetual bằng Docker.
#
#   # LẦN ĐẦU: tạo sẵn file state (bind-mount file chưa tồn tại → Docker tạo THƯ MỤC làm hỏng bot)
#   touch bot-state.json trades-live.jsonl turtle-state.json turtle-trades.jsonl fast-trend-state.json fast-trend-trades.jsonl
#
#   docker compose up -d --build      # build từ source rồi chạy nền (luôn có turtle + lệnh thật)
#   docker compose logs -f swing-bot  # xem log bot (tìm "🐢 Turtle:" và "THỰC THI BẬT")
#   docker compose down               # dừng
#
# CẦN: file .env.local chứa TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (xem .env.example).
# LƯU Ý: KHÔNG chạy đồng thời 2 instance bot cùng 1 Telegram token
#        — getUpdates giao mỗi update đúng 1 lần, hai bên sẽ giành /status.
services:
  swing-bot:
    build: .
    image: swing-alert-bot
    container_name: swing-bot
    command: node bot.js
    env_file: .env.local
    environment:
      TZ: Asia/Ho_Chi_Minh
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./bot-state.json:/app/bot-state.json
      - ./trades-live.jsonl:/app/trades-live.jsonl
      - ./turtle-state.json:/app/turtle-state.json
      - ./turtle-trades.jsonl:/app/turtle-trades.jsonl
      - ./fast-trend-state.json:/app/fast-trend-state.json
      - ./fast-trend-trades.jsonl:/app/fast-trend-trades.jsonl
    restart: unless-stopped

  swing-chart:
    build: .
    image: swing-alert-bot
    container_name: swing-chart
    command: node chart.js
    environment:
      TZ: Asia/Ho_Chi_Minh
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3847:3847"
    restart: unless-stopped

  # Dashboard theo dõi giao dịch (đọc state + tài khoản Binance read-only).
  # ⚠️ Cổng 3848 chỉ bind localhost — KHÔNG mở ra Internet (hiển thị số dư/vị thế).
  #    Truy cập từ xa qua SSH tunnel: ssh -L 3848:localhost:3848 user@vm
  swing-dashboard:
    build: .
    image: swing-alert-bot
    container_name: swing-dashboard
    command: node dashboard.js
    env_file: .env.local
    environment:
      TZ: Asia/Ho_Chi_Minh
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./bot-state.json:/app/bot-state.json:ro
      - ./trades-live.jsonl:/app/trades-live.jsonl:ro
    ports:
      - "127.0.0.1:3848:3848"
    restart: unless-stopped
