# Mặc định chỉ chạy UI chart + dashboard. Bot nằm trong profile "trading"
# và chỉ được bật khi gọi profile đó một cách rõ ràng.
#
#   # LẦN ĐẦU: state atomic cần mount cả thư mục, không bind-mount từng file.
#   mkdir -p trading-runtime/chart-playbook fast-trend-mexc-runtime
#   touch trading-runtime/bot-state.json trading-runtime/trades-live.jsonl \
#         trading-runtime/turtle-state.json trading-runtime/turtle-trades.jsonl
#
#   docker compose up -d --build      # UI + dashboard, KHÔNG bật Turtle/Fast
#   docker compose --profile trading up -d --build  # explicit: bật thêm bot
#   docker compose logs -f swing-bot  # xem log bot (tìm "🐢 Turtle:" và "THỰC THI BẬT")
#   docker compose down               # dừng
#
# CẦN: file .env.local chứa TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (xem .env.example).
# LƯU Ý: KHÔNG chạy đồng thời 2 instance bot cùng 1 Telegram token
#        — getUpdates giao mỗi update đúng 1 lần, hai bên sẽ giành /status.
services:
  swing-bot:
    profiles: ["trading"]
    build: .
    image: swing-alert-bot
    container_name: swing-bot
    command: node bot.js
    env_file: .env.local
    environment:
      TZ: Asia/Ho_Chi_Minh
      TRADING_DATA_DIR: /app/trading-runtime
      FAST_TREND_DATA_DIR: /app/fast-trend-mexc-runtime
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # Mount directory để SMC/Turtle có thể temp+fsync+rename atomic.
      - ./trading-runtime:/app/trading-runtime
      - ./fast-trend-state.json:/app/fast-trend-state.json
      - ./fast-trend-trades.jsonl:/app/fast-trend-trades.jsonl
      # Mount the directory, not each file: Fast persists with atomic temp+rename.
      - ./fast-trend-mexc-runtime:/app/fast-trend-mexc-runtime
    restart: unless-stopped

  swing-chart:
    build: .
    image: swing-alert-bot
    container_name: swing-chart
    command: node chart.js
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Defense in depth: chart không import bot; các cờ này còn khóa trading
      # nếu entrypoint của image bị thay đổi nhầm trong tương lai.
      TRADING_ENABLED: "false"
      TURTLE_ENABLED: "false"
      TURTLE_TRADING_ENABLED: "false"
      MEXC_TRADING_ENABLED: "false"
      FAST_TREND_ENABLED: "false"
      FAST_TREND_TRADING_ENABLED: "false"
      # Chart XAUUSD read-only. Docker Compose đọc các giá trị này từ shell hoặc file .env.
      OANDA_ENV: "${OANDA_ENV:-practice}"
      OANDA_ACCOUNT_ID: "${OANDA_ACCOUNT_ID:-}"
      OANDA_API_TOKEN: "${OANDA_API_TOKEN:-}"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # chart-server POST /api/playbook ghi trading-runtime/chart-playbook/<symbol>.json
      # (playbook-store.ts). Không có mount này, nhãn key do người chấm nằm trong
      # writable layer và MẤT khi `down` / `up --build`.
      # Chỉ mount đúng thư mục playbook — chart không được thấy state/journal của bot.
      # Mount THƯ MỤC (không mount từng file): playbook ghi bằng temp + rename.
      - ./trading-runtime/chart-playbook:/app/trading-runtime/chart-playbook
    ports:
      - "3847:3847"
    restart: unless-stopped

  # Dashboard theo dõi giao dịch (đọc state + tài khoản Binance read-only).
  # ⚠️ Cổng 3848 chỉ bind localhost — KHÔNG mở ra Internet (hiển thị số dư/vị thế).
  #    Truy cập từ xa qua SSH tunnel: ssh -L 3848:localhost:3848 user@vm
  swing-dashboard:
    build: .
    image: swing-alert-bot
    container_name: swing-dashboard
    command: node dashboard.js
    env_file: .env.local
    environment:
      TZ: Asia/Ho_Chi_Minh
      TRADING_DATA_DIR: /app/trading-runtime
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./trading-runtime:/app/trading-runtime:ro
    ports:
      - "127.0.0.1:3848:3848"
    restart: unless-stopped
